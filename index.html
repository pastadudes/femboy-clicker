<!doctype html>
<html>
  <head>
    <title>femboy-clicker</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a2e;
        color: #eee;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        padding: 1rem;
        text-align: center;
      }
      header h1 { font-size: 1.5rem; }
      #game {
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
      }
      #game canvas { display: block; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }
      footer {
        padding: 1rem;
        font-size: 0.85rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>femboy-clicker</h1>
    </header>
    <main>
      <div id="game"></div>
    </main>
    <footer>more content coming soon</footer>
    <script src="src/main.js" type="module"></script>
  </body>
</html>
