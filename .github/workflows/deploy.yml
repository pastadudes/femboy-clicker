name: deploy femboy-clicker to pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  DENO_DIR: .deno_cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout!!!
        uses: actions/checkout@v6

      - name: setup deno
        uses: denoland/setup-deno@v2

      - name: cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          # link the cache to the lockfile
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: install deps and shi
        run: deno install --frozen

      - name: build kaplay
        run: deno task build

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy!!!
        id: deployment
        uses: actions/deploy-pages@v5
